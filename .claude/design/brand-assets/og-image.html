<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.bunny.net/css?family=figtree:500,600,800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden; font-family: Figtree, sans-serif;
          background: linear-gradient(135deg, oklch(0.47 0.09 143) 0%, oklch(0.34 0.07 143) 48%, oklch(0.18 0.01 150) 100%); color: #fff; }
  .globe { position: absolute; left: 96px; top: 125px; width: 360px; height: 360px; }
  .text { position: absolute; left: 520px; right: 80px; top: 50%; transform: translateY(-54%); }
  .eyebrow { font-size: 19px; font-weight: 600; letter-spacing: .09em; white-space: nowrap; text-transform: uppercase; color: oklch(0.93 0.03 143); }
  h1 { margin: 18px 0 0; font-size: 84px; line-height: .98; font-weight: 800; letter-spacing: -.02em; }
  p { margin: 26px 0 0; font-size: 30px; line-height: 1.35; font-weight: 500; color: oklch(0.93 0.03 143); max-width: 560px; }
  .ribbon { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; display: grid; grid-template-columns: repeat(6, 1fr); }
  .ribbon span:nth-child(1) { background: oklch(0.47 0.09 143) } .ribbon span:nth-child(2) { background: oklch(0.47 0.09 10) }
  .ribbon span:nth-child(3) { background: oklch(0.47 0.09 325) } .ribbon span:nth-child(4) { background: oklch(0.47 0.09 70) }
  .ribbon span:nth-child(5) { background: oklch(0.47 0.09 275) } .ribbon span:nth-child(6) { background: oklch(0.47 0.09 220) }
</style></head>
<body>
  <div class="card">
    <img class="globe" src="og-globe.png" alt="">
    <div class="text">
      <div class="eyebrow">United Pentecostal Church International</div>
      <h1>UPCI New Zealand</h1>
      <p>Churches, departments and regions across Aotearoa.</p>
    </div>
    <div class="ribbon"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</body></html>
